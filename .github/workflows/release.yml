name: Release CLIProxyAPI Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  PLUGIN_ID: aistudio2api
  SPIDERMONKEY_TAG: v152.0.4-aistudio2api.1

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            os: macos-15
            ext: .dylib
            sm_platform: darwin-arm64
          - goos: darwin
            goarch: amd64
            os: macos-15
            ext: .dylib
            sm_platform: darwin-amd64
          - goos: linux
            goarch: amd64
            os: ubuntu-24.04
            ext: .so
            sm_platform: linux-amd64-gnu
          - goos: windows
            goarch: amd64
            os: ubuntu-24.04
            ext: .dll
            sm_platform: windows-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Setup LLVM-MinGW (Windows target)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
          echo "CC=x86_64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CXX=x86_64-w64-mingw32-clang++" >> "$GITHUB_ENV"

      - name: Download SpiderMonkey (${{ matrix.sm_platform }})
        shell: bash
        run: |
          mkdir -p spidermonkey
          url="https://github.com/Mag1cFall/firefox/releases/download/${SPIDERMONKEY_TAG}/spidermonkey-${SPIDERMONKEY_TAG}-${{ matrix.sm_platform }}.tar.gz"
          curl -fsSL "$url" | tar -xz -C spidermonkey

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build Dynamic Library & Package Zip
        shell: bash
        run: |
          mkdir -p out
          LIB_NAME="${PLUGIN_ID}${{ matrix.ext }}"
          ZIP_NAME="${PLUGIN_ID}_${{ steps.ver.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          export CGO_ENABLED=1
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          export CGO_CXXFLAGS="-I${PWD}/spidermonkey/include"
          export CGO_LDFLAGS="-L${PWD}/spidermonkey/lib"
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            export MACOSX_DEPLOYMENT_TARGET="12.0"
            export CGO_CFLAGS="-mmacosx-version-min=12.0 -arch ${{ matrix.goarch == 'amd64' && 'x86_64' || 'arm64' }}"
            export CGO_CXXFLAGS="${CGO_CXXFLAGS} -mmacosx-version-min=12.0 -arch ${{ matrix.goarch == 'amd64' && 'x86_64' || 'arm64' }}"
            export CGO_LDFLAGS="${CGO_LDFLAGS} -mmacosx-version-min=12.0 -arch ${{ matrix.goarch == 'amd64' && 'x86_64' || 'arm64' }}"
          fi
          go build -trimpath -buildmode=c-shared -o "out/${LIB_NAME}" ./cmd/aistudio2api-plugin
          (cd out && zip -qr "../${ZIP_NAME}" "${LIB_NAME}")

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "${{ env.PLUGIN_ID }}_*_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          if gh release view "$RAW_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$RAW_TAG" *.zip checksums.txt --clobber --repo "${{ github.repository }}"
          else
            gh release create "$RAW_TAG" *.zip checksums.txt --title "$RAW_TAG" --generate-notes --repo "${{ github.repository }}"
          fi
          else
            gh release create "$RAW_TAG" *.zip checksums.txt --title "$RAW_TAG" --generate-notes
          fi
