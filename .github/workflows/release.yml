name: Release CLIProxyAPI Plugin

on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (optional, e.g. v1.2.1)"
        required: false
        default: ""
  workflow_call:
    inputs:
      ref:
        description: "Branch or tag ref to checkout when invoked via workflow_call"
        type: string
        required: false
        default: ""

permissions:
  contents: write

env:
  PLUGIN_ID: aistudio2api
  SPIDERMONKEY_TAG: v152.0.4-aistudio2api.1
  LIBWEBP_TAG: v1.6.0-aistudio2api.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-24.04
            ext: .so
            sm_platform: linux-amd64-gnu
          - goos: windows
            goarch: amd64
            os: ubuntu-24.04
            ext: .dll
            sm_platform: windows-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      - name: Setup LLVM-MinGW (Windows target)
        if: matrix.goos == 'windows'
        shell: bash
        run: |
          curl -fsSL https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/llvm-mingw-20261020-ucrt-ubuntu-22.04-x86_64/bin" >> "$GITHUB_PATH"
          echo "CC=x86_64-w64-mingw32-clang" >> "$GITHUB_ENV"
          echo "CXX=x86_64-w64-mingw32-clang++" >> "$GITHUB_ENV"

      - name: Download Static Libraries (${{ matrix.sm_platform }})
        shell: bash
        run: |
          mkdir -p spidermonkey libwebp
          curl -fsSL "https://github.com/Mag1cFall/firefox/releases/download/${SPIDERMONKEY_TAG}/spidermonkey-${SPIDERMONKEY_TAG}-${{ matrix.sm_platform }}.tar.gz" | tar -xz -C spidermonkey
          curl -fsSL "https://github.com/Mag1cFall/libwebp/releases/download/${LIBWEBP_TAG}/libwebp-${LIBWEBP_TAG}-${{ matrix.sm_platform }}.tar.gz" | tar -xz -C libwebp

      - name: Determine Version
        id: ver
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            RAW_TAG="$INPUT_TAG"
          elif [[ "$EVENT_REF" == refs/tags/v* ]]; then
            RAW_TAG="$EVENT_REF_NAME"
          else
            PLUGIN_VER=$(sed -n 's/.*PluginVersion *= *"\([^"]*\)".*/\1/p' internal/cpa/config.go | head -n 1)
            if [ -z "$PLUGIN_VER" ]; then
              echo "::error::Failed to extract PluginVersion from internal/cpa/config.go"
              exit 1
            fi
            RAW_TAG="v${PLUGIN_VER#v}"
          fi
          VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Run Go Vet & Unit Tests (linux/amd64)
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          export CGO_ENABLED=1
          export CGO_CPPFLAGS="-I${PWD}/spidermonkey/include -I${PWD}/libwebp/include"
          export CGO_LDFLAGS="-L${PWD}/spidermonkey/lib -L${PWD}/libwebp/lib"
          go vet ./...
          go test ./internal/aistudio ./internal/api ./internal/config ./internal/cpa ./internal/imagecodec/... ./internal/proxydial ./internal/resample ./internal/waa

      - name: Build Dynamic Library & Package Zip
        shell: bash
        run: |
          mkdir -p out
          LIB_NAME="${PLUGIN_ID}${{ matrix.ext }}"
          ZIP_NAME="${PLUGIN_ID}_${{ steps.ver.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          export CGO_ENABLED=1
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          export CGO_CPPFLAGS="-I${PWD}/spidermonkey/include -I${PWD}/libwebp/include"
          export CGO_LDFLAGS="-L${PWD}/spidermonkey/lib -L${PWD}/libwebp/lib"
          go build -trimpath -ldflags="-s -w" -buildmode=c-shared -o "out/${LIB_NAME}" ./cmd/aistudio2api-plugin
          (cd out && zip -qr "../${ZIP_NAME}" "${LIB_NAME}")

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "${{ env.PLUGIN_ID }}_*_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || inputs.ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            RAW_TAG="$INPUT_TAG"
          elif [[ "$EVENT_REF" == refs/tags/v* ]]; then
            RAW_TAG="$EVENT_REF_NAME"
          else
            PLUGIN_VER=$(sed -n 's/.*PluginVersion *= *"\([^"]*\)".*/\1/p' internal/cpa/config.go | head -n 1)
            if [ -z "$PLUGIN_VER" ]; then
              echo "::error::Failed to extract PluginVersion from internal/cpa/config.go"
              exit 1
            fi
            RAW_TAG="v${PLUGIN_VER#v}"
          fi
          VERSION="${RAW_TAG#v}"
          echo "Publishing release ${RAW_TAG} (version ${VERSION})"

          if gh release view "$RAW_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$RAW_TAG" --yes --cleanup-tag --repo "${{ github.repository }}" || true
          fi

          HEAD_SHA=$(git rev-parse HEAD)
          git tag -f "$RAW_TAG" "$HEAD_SHA"
          git push origin "refs/tags/${RAW_TAG}" --force

          cd artifacts
          sha256sum *.zip > checksums.txt
          cat checksums.txt

          gh release create "$RAW_TAG" *.zip checksums.txt \
            --title "$RAW_TAG" \
            --generate-notes \
            --latest \
            --repo "${{ github.repository }}"
